# Kamal deploy to the max1 VPS, alongside nexus-cleaning and rugsuiteerp.
service: nexus-shine
image: anadimitrova81/nexus-shine

servers:
  web:
    - 93.94.140.141

# SSL via Let's Encrypt through the shared kamal-proxy. Certificates are
# issued automatically once the domain's DNS points at the server.
proxy:
  ssl: true
  host: nexus-shine.com,www.nexus-shine.com

registry:
  server: ghcr.io
  username: anadimitrova81
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - NEXUS_SHINE_DATABASE_PASSWORD
  clear:
    # Run the Solid Queue supervisor inside Puma (mailers, Active Storage jobs).
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: nexus-shine-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "nexus_shine_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://root@93.94.140.141

accessories:
  db:
    image: postgres:16
    host: 93.94.140.141
    # 5432/5433 are taken by nexus-cleaning and rugsuiteerp.
    port: "127.0.0.1:5434:5432"
    env:
      clear:
        POSTGRES_USER: nexus_shine
        POSTGRES_DB: nexus_shine_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
